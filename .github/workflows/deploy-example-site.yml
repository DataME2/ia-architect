name: Deploy example guidance site

on:
  push:
    branches: [main]
    paths:
      - "example/site/**"
      - ".github/workflows/deploy-example-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
