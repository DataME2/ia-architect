name: Code check

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/check_rls.py"
      - "package.json"
      - "tsconfig*.json"
      - "next.config.ts"
      - ".github/workflows/code-check.yml"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Typed routes only exist once `next build` has generated them, so a
      # broken `redirect()` or `<a href>` target is invisible to `tsc` alone.
      # The placeholder credentials are not secrets and reach no network:
      # every page is dynamic, so nothing is rendered at build time.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
        run: npm run build
      # P5 is enforced by Row-Level Security. A table without a policy is a
      # cross-tenant leak, so coverage is a build gate rather than a review item.
      - name: RLS policy coverage
        run: python3 scripts/check_rls.py

  # check_rls.py proves a policy exists. This proves it works — a policy can
  # be present and wrong, and the failure is silent until one club reads
  # another club's records.
  rls-behaviour:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and assert tenant isolation
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test_rls.sh
